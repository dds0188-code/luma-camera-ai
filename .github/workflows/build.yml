name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Assemble Android debug APK
        run: gradle :androidApp:assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: luma-camera-ai-android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile Windows desktop target
        run: gradle :shared:compileKotlinDesktop
      - name: Package Windows installer
        run: gradle :shared:packageMsi
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: luma-camera-ai-windows-msi
          path: shared/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
